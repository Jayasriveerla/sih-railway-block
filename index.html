<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIH Railway Block Scheduler</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 8px; }
        label { display: block; margin-top: 10px; }
        select, input, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: none; }
        button { background: #2563eb; color: white; font-weight: bold; margin-top: 15px; cursor: pointer; }
        #logTerminal { background: #000; padding: 15px; border-radius: 4px; font-family: monospace; min-height: 120px; margin-top: 15px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Railway Algorithmic De-confliction</h2>
        <form id="schedulerForm">
            <label>Select Sector</label>
            <select id="sectorSelect">
                <option value="Section_Alpha">Section Alpha</option>
                <option value="Section_Beta">Section Beta</option>
            </select>

            <label>Start Time (HH:MM)</label>
            <input type="time" id="timeInput" required>

            <label>Duration (Minutes)</label>
            <input type="number" id="durationInput" min="15" max="240" placeholder="30" required>

            <button id="submitBtn" type="submit">Run Algorithmic De-confliction</button>
        </form>

        <div id="logTerminal">[SYSTEM READY] Awaiting schedule input...</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
